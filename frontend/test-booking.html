<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Test Booking</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                    radial-gradient(
                            circle at 10% 20%,
                            #6a5acd,
                            transparent 35%
                    ),
                    radial-gradient(
                            circle at 90% 80%,
                            #ff4ecd,
                            transparent 35%
                    ),
                    linear-gradient(
                            135deg,
                            #141e30,
                            #243b55
                    );

            padding: 30px;
        }

        .container {
            width: 850px;
            max-width: 95%;

            padding: 35px;

            background: rgba(255, 255, 255, 0.96);

            border-radius: 20px;

            box-shadow:
                    0 20px 50px
                    rgba(0, 0, 0, 0.35);
        }

        h1 {
            text-align: center;

            margin-top: 0;
            margin-bottom: 30px;

            color: #222;
        }

        h2 {
            margin-top: 25px;
            margin-bottom: 10px;

            font-size: 18px;
            color: #333;
        }

        select {
            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;
            border-radius: 10px;

            font-size: 15px;

            background: white;
        }

        /* =========================
           MÀN HÌNH
           ========================= */

        .screen {
            text-align: center;

            margin: 20px 40px;

            padding: 10px;

            background: #ddd;

            border-radius: 50%;

            color: #555;

            font-weight: bold;

            letter-spacing: 4px;
        }

        /* =========================
           50 GHẾ
           ========================= */

        #seat-container {

            display: grid;

            grid-template-columns:
                repeat(10, 1fr);

            gap: 8px;

            padding: 20px;

            background: #f5f5f5;

            border-radius: 15px;
        }

        .seat {

            height: 42px;

            border: none;

            border-radius: 8px;

            background: #ddd;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .seat:hover {
            transform: scale(1.05);

            background: #bbb;
        }

        .seat.selected {
            background: #28a745;

            color: white;
        }

        .seat.booked {
            background: #777;

            color: white;

            cursor: not-allowed;
        }

        /* =========================
           CHÚ THÍCH GHẾ
           ========================= */

        .legend {

            display: flex;

            justify-content: center;

            gap: 25px;

            margin-top: 15px;

            font-size: 14px;
        }

        .legend-item {

            display: flex;

            align-items: center;

            gap: 7px;
        }

        .legend-box {

            width: 18px;
            height: 18px;

            border-radius: 4px;

            background: #ddd;
        }

        .legend-box.selected {
            background: #28a745;
        }

        .legend-box.booked {
            background: #777;
        }

        /* =========================
           BOOKING INFO
           ========================= */

        #booking-info {

            margin-top: 15px;

            padding: 20px;

            background: #f5f5f5;

            border-radius: 15px;
        }

        #booking-info p {

            display: flex;

            justify-content: space-between;

            margin: 0;

            padding: 10px 0;

            border-bottom: 1px solid #ddd;
        }

        #booking-info p:last-child {
            border-bottom: none;
        }

        #selected-seat {
            color: #28a745;

            font-weight: bold;
        }

        #discount {
            color: #e67e22;

            font-weight: bold;
        }

        #total-price {

            color: #6a5acd;

            font-size: 20px;

            font-weight: bold;
        }

        /* =========================
           BUTTON
           ========================= */

        #booking-button {

            width: 100%;

            margin-top: 25px;

            padding: 15px;

            border: none;

            border-radius: 10px;

            background:
                    linear-gradient(
                            135deg,
                            #6a5acd,
                            #ff4ecd
                    );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        #booking-button:hover {

            transform: translateY(-2px);

            box-shadow:
                    0 8px 20px
                    rgba(106, 90, 205, 0.3);
        }

    </style>

</head>


<body>


<div class="container">


    <h1>🎬 TEST BOOKING</h1>

         KHÁCH HÀNG
         ========================= -->

        <button class="seat" data-seat="A8">A8</button>

        <!-- Hàng B -->

        <button class="seat" data-seat="B1">B1</button>
        <button class="seat" data-seat="B2">B2</button>
        <button class="seat" data-seat="B3">B3</button>
        <button class="seat" data-seat="B4">B4</button>
        <button class="seat" data-seat="B5">B5</button>
        <button class="seat" data-seat="B6">B6</button>
        <button class="seat" data-seat="B7">B7</button>
        <button class="seat" data-seat="B8">B8</button>
        <button class="seat" data-seat="B9">B9</button>
        <button class="seat" data-seat="B10">B10</button>

        <!-- Hàng C -->

        <button class="seat" data-seat="C1">C1</button>

    <div class="legend">

        <div class="legend-item">

    <!-- =========================

         ========================= -->

</div>


<!-- =========================
     BOOKING.JS
     ========================= -->

<script src="js/booking.js"></script>


<script>

    // ==========================================
    // CUSTOMER TEST
    // ==========================================

    const customerId = "C01";


    // ==========================================
    // GHẾ TEST
    // ==========================================

    let testSelectedSeats = [];


    const seatButtons =
        document.querySelectorAll(".seat");


    // ==========================================
    // GIẢ LẬP MỘT SỐ GHẾ ĐÃ ĐẶT
    // ==========================================

    const bookedSeats = [
        "A3",
        "A10",
        "B5",
        "C7",
        "D10"
    ];


    seatButtons.forEach(function(button) {

        const seatNumber =
            button.dataset.seat;


        // Ghế đã đặt

        if (
            bookedSeats.includes(
                seatNumber
            )
        ) {

            button.classList.add(
                "booked"
            );

            button.disabled = true;

            return;
        }


        // Chọn ghế

        button.addEventListener(
            "click",
            function() {

                const index =
                    testSelectedSeats.indexOf(
                        seatNumber
                    );


                // Thêm ghế

                if (index === -1) {

                    testSelectedSeats.push(
                        seatNumber
                    );

                    button.classList.add(
                        "selected"
                    );

                }

                // Bỏ ghế

                else {

                    testSelectedSeats.splice(
                        index,
                        1
                    );

                    button.classList.remove(
                        "selected"
                    );

                }


                // Gửi sang booking.js

                setSelectedSeats(
                    testSelectedSeats
                );

            }
        );

    });


    // ==========================================
    // CHỌN LOẠI KHÁCH
    // ==========================================

    document.getElementById(
        "customer-type"
    ).addEventListener(
        "change",
        function() {

            setCustomerType(
                this.value
            );

        }
    );


    // ==========================================
    // CHỌN PHƯƠNG THỨC THANH TOÁN
    // ==========================================

    document.getElementById(
        "payment-method"
    ).addEventListener(
        "change",
        function() {

            setPaymentMethod(
                this.value
            );

        }
    );


    // ==========================================
    // ĐẶT VÉ
    // ==========================================

    document.getElementById(
        "booking-button"
    ).addEventListener(
        "click",
        function() {


            const showtime =
                document.getElementById(
                    "showtime"
                ).value;


            const customerType =
                document.getElementById(
                    "customer-type"
                ).value;


            const paymentMethod =
                document.getElementById(
                    "payment-method"
                ).value;


            // Gọi booking.js

            confirmBooking(

                customerId,

                showtime,

                testSelectedSeats,

                customerType,

                paymentMethod

            );

        }
    );

</script>


</body>

</html>
